[package]
name = "comicrich"
version = "0.1.0"
edition = "2021"
description = "Unofficial Discord Rich Presence companion for the CDisplayEx comic reader"
license = "MIT"
repository = "https://github.com/PupsikTheProgrammer/ComicRich-CDisplayEx-Discord-Rich-Presence"
publish = false

[dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unrar = "0.5"
flate2 = "1"
ureq = { version = "2.10", features = ["json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_UI_Shell"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# Speed over size: archive decompression for cover matching runs ~5x slower at "z".
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
