# ComicRich settings. Every field is optional; changes apply the next time you
# open a comic.

# Discord application whose name and icon your status shows
# (Discord Developer Portal -> your application -> General Information).
app_id = "1533059701124632717"

# Language of the status text: "en" or "ru".
language = "en"

# Look comics up in online databases for official titles, covers and the
# issues inside collected editions.
online = true

# https://metron.cloud — main database, free account.
# Create a token on your account page, section "API Tokens".
# (username and password still work instead, but Metron has deprecated them.)
[metron]
token = ""

# https://comicvine.gamespot.com/api — fallback database, free API key.
[comicvine]
api_key = ""
